[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rowlint"
version = "0.1.0"
description = "Lightweight, configurable data quality checks for pandas and CSV pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sodiq Gbadebo-Ogunmefun", email = "goluwatobisodiq@gmail.com"}]
dependencies = ["pandas>=2.2,<4", "PyYAML>=6,<7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/dotserver/rowlint"
Issues = "https://github.com/dotserver/rowlint/issues"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
polars = ["polars>=1", "pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "build>=1.2", "twine>=6"]

[project.scripts]
rowlint = "rowlint.cli:main"

[tool.setuptools.packages.find]
include = ["rowlint*"]

[tool.setuptools.package-data]
rowlint = ["default_config.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["rowlint"]

[tool.coverage.report]
show_missing = true
