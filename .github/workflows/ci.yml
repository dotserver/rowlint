name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            pandas: 'pandas==2.2.0'
            numpy: 'numpy<2'
          - python: '3.11'
            pandas: 'pandas>=2.2,<3'
            numpy: 'numpy>=1.26'
          - python: '3.11'
            pandas: 'pandas>=3,<4'
            numpy: 'numpy>=1.26'
          - python: '3.12'
            pandas: 'pandas>=2.2,<4'
            numpy: 'numpy>=1.26'
          - python: '3.13'
            pandas: 'pandas>=2.2,<4'
            numpy: 'numpy>=1.26'
          - python: '3.14'
            pandas: 'pandas>=2.2,<4'
            numpy: 'numpy>=1.26'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev,parquet,polars]' '${{ matrix.pandas }}' '${{ matrix.numpy }}'
      - run: python -m pytest --cov=rowlint

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/smoke_install.py dist/*.whl dist/*.tar.gz
