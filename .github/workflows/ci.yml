name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install '.[dev]' 'pandas==2.2.0' 'numpy<2'
      - run: python -m pip check
      - run: python -m pytest --cov=rowlint

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum versions for the optional backends all support NumPy 2.
          - python: '3.11'
            pandas: 'pandas==2.2.2'
            numpy: 'numpy==2.0.0'
            pyarrow: 'pyarrow==16.0.0'
          - python: '3.11'
            pandas: 'pandas>=2.2,<3'
            numpy: 'numpy>=2'
            pyarrow: 'pyarrow>=14'
          - python: '3.11'
            pandas: 'pandas>=3,<4'
            numpy: 'numpy>=2'
            pyarrow: 'pyarrow>=14'
          - python: '3.12'
            pandas: 'pandas>=2.2,<4'
            numpy: 'numpy>=2'
            pyarrow: 'pyarrow>=14'
          - python: '3.13'
            pandas: 'pandas>=2.2,<4'
            numpy: 'numpy>=2'
            pyarrow: 'pyarrow>=14'
          - python: '3.14'
            pandas: 'pandas>=2.2,<4'
            numpy: 'numpy>=2'
            pyarrow: 'pyarrow>=14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev,parquet,polars]' '${{ matrix.pandas }}' '${{ matrix.numpy }}' '${{ matrix.pyarrow }}'
      - name: Check installed dependencies
        run: |
          python -m pip check
          python -c "from importlib.metadata import version; print({name: version(name) for name in ('pandas', 'numpy', 'pyarrow', 'polars')})"
      - run: python -m pytest --cov=rowlint

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/smoke_install.py dist/*.whl dist/*.tar.gz
      - run: python scripts/smoke_install.py --extras parquet,polars dist/*.whl dist/*.tar.gz
